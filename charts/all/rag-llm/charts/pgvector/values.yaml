# Default values for pgvector.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: docker.io/pgvector/pgvector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: pg17

imagePullSecrets: []

nameOverride: "pgvector"
fullnameOverride: "pgvector"

serviceAccount:
  create: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

lifecycle:
  postStart:
    exec:
      command:
        - /bin/sh
        - -c
        - |
          for i in $(seq 1 30); do
            if pg_isready -U "$POSTGRES_USER"; then
              psql -U "$POSTGRES_USER" -c "ALTER USER \"$POSTGRES_USER\" WITH PASSWORD '$POSTGRES_PASSWORD';"
              psql -U "$POSTGRES_USER" -c "CREATE DATABASE \"$POSTGRES_DBNAME\";" || true
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DBNAME" -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
              break
            fi
            sleep 1
          done

service:
  type: ClusterIP
  port: 5432

env:
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        key: username
        name: vectordb-app
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: vectordb-app
  - name: POSTGRES_PORT
    valueFrom:
      secretKeyRef:
        key: port
        name: vectordb-app
  - name: POSTGRES_DBNAME
    valueFrom:
      secretKeyRef:
        key: dbname
        name: vectordb-app

resources: {}

autoscaling:
  enabled: false

volumeClaimTemplates:
  - metadata:
      name: pg-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi

volumeMounts:
  - mountPath: /docker-entrypoint-initdb.d
    name: initdb-volume
  - mountPath: /var/lib/postgresql
    name: pg-data

nodeSelector: {}
affinity: {}

secretStore:
  name: vault-backend
  kind: ClusterSecretStore
  key: secret/data/hub/pgvector

extraDatabases: []
  #- name: test_db
  #  vectordb: false
