global:
  localClusterDomain: apps.example.com
  hubClusterDomain: example.com
  db:
    index: docs
    type: PGVECTOR
  model:
    vllm: google/gemma-3-4b-it
    embedding: Qwen/Qwen3-Embedding-0.6B
    storageClass: gp3-csi

llmui:
  namespace: "rag-llm"


replicaCount: 1

image:
  repository: quay.io/dminnear/gradio-tgi-multi-model-rag
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

ui:
  build:
    enabled: true
  imageStream:
    name: rag-llm-ui
    tag: latest
  buildConfig:
    name: rag-llm-ui

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000


securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 7860
  metricsPort: 8000

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: '2'
    memory: 2Gi
  requests:
    cpu: '1'
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  timeoutSeconds: 8
  periodSeconds: 100
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  timeoutSeconds: 5
  periodSeconds: 30
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  timeoutSeconds: 1
  periodSeconds: 30
  successThreshold: 1
  failureThreshold: 24

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: providerconfig
    configMap:
      name: providerconfig
      defaultMode: 420
  - name: cache-volume
    emptyDir:
      sizeLimit: 5Gi
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: providerconfig
    mountPath: /opt/app-root/config
  - name: cache-volume
    mountPath: /tmp/.cache
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 1

route:
  enabled: true
  name: llm-ui
  portName: http
  labels:
  annotations:
  # path: /

populateDbJob:
  ## Job image
  image:
    repository: quay.io/hybridcloudpatterns/vector-embedder
    tag: latest
    pullPolicy: Always

  ## Job configurations
  backoffLimit: 10
  restartPolicy: Never

  command:
    - /bin/sh
    - -c
  args:
    - |
      set -e
      echo "[Init] Copying embedder app to writable /tmp/app..."
      cp -r /app /tmp/app

      echo "[Init] Configuring AsciiDoc text loader and git branch support in /tmp/app..."
      cat << 'PYEOF' > /tmp/app/loaders/text.py
      import logging
      from pathlib import Path
      from typing import List
      from langchain.text_splitter import RecursiveCharacterTextSplitter
      from langchain_core.documents import Document
      from config import Config

      logger = logging.getLogger(__name__)

      class TextLoader:
          def __init__(self, config: Config):
              self.config = config
              self.splitter = RecursiveCharacterTextSplitter(
                  chunk_size=config.chunk_size,
                  chunk_overlap=config.chunk_overlap,
              )

          def _process_single_file(self, path: Path) -> List[Document]:
              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except Exception as e:
                  logger.warning("Failed to read %s: %s", path, e)
                  return []

              if not content.strip():
                  return []

              raw_chunks = self.splitter.split_text(content)
              fname = path.name
              source_str = str(path)
              chunks = []
              for idx, text in enumerate(raw_chunks):
                  heading = f"## {fname}\n"
                  chunks.append(Document(
                      page_content=heading + text,
                      metadata={"source": source_str, "chunk_id": idx}
                  ))
              return chunks

          def _add_chunk_totals(self, docs: List[Document]) -> None:
              counts = {}
              for doc in docs:
                  s = doc.metadata["source"]
                  counts[s] = counts.get(s, 0) + 1
              for doc in docs:
                  doc.metadata["chunk_total"] = counts[doc.metadata["source"]]

          def load(self, paths: List[Path]) -> List[Document]:
              grouped = []
              for path in paths:
                  try:
                      chunks = self._process_single_file(path)
                      grouped.extend(chunks)
                  except Exception as e:
                      logger.warning("Failed to load %s: %s", path, e)
              self._add_chunk_totals(grouped)
              logger.info("Successfully produced %d chunks from %d files", len(grouped), len(paths))
              return grouped
      PYEOF

      cat << 'PYEOF' > /tmp/app/loaders/git.py
      import logging, shutil, subprocess
      from pathlib import Path
      from typing import List
      from langchain_core.documents import Document
      from config import Config
      from loaders.pdf import PDFLoader
      from loaders.text import TextLoader

      logger = logging.getLogger(__name__)

      class GitLoader:
          def __init__(self, config: Config):
              self.config = config
              self.base_path = Path(config.temp_dir) / "repo_sources"
              self.pdf_loader = PDFLoader(config)
              self.text_loader = TextLoader(config)

          def load(self) -> List[Document]:
              all_chunks: List[Document] = []
              for repo_entry in self.config.repo_sources:
                  repo_url = repo_entry["repo"]
                  globs = repo_entry.get("globs", [])
                  branch = repo_entry.get("branch")
                  repo_name = repo_url.rstrip("/").split("/")[-1].replace(".git", "")
                  repo_path = self.base_path / repo_name
                  self._ensure_repo_up_to_date(repo_url, repo_path, branch)
                  matched_files = self._collect_files(repo_path, globs)
                  matched_files = [f for f in matched_files if f.is_file()]
                  pdf_files = [f for f in matched_files if f.suffix.lower() == ".pdf"]
                  text_files = [f for f in matched_files if f.suffix.lower() != ".pdf"]
                  docs: List[Document] = []
                  if pdf_files:
                      docs.extend(self.pdf_loader.load(pdf_files))
                  if text_files:
                      docs.extend(self.text_loader.load(text_files))
                  for doc in docs:
                      local_src = Path(doc.metadata.get("source", ""))
                      try:
                          rel_path = local_src.relative_to(repo_path)
                      except ValueError:
                          rel_path = local_src
                      doc.metadata.update({"source": f"{repo_url}@{rel_path.as_posix()}"})
                  all_chunks.extend(docs)
              return all_chunks

          def _ensure_repo_up_to_date(self, url: str, dest: Path, branch: str = None) -> None:
              if dest.exists():
                  try:
                      subprocess.run(["git", "-C", str(dest), "pull"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if branch:
                          subprocess.run(["git", "-C", str(dest), "checkout", branch], check=False)
                      return
                  except subprocess.CalledProcessError:
                      shutil.rmtree(dest)
              self._clone_repo(url, dest, branch)

          def _clone_repo(self, url: str, dest: Path, branch: str = None) -> None:
              logger.info("Cloning repo %s (branch: %s) to %s", url, branch, dest)
              cmd = ["git", "clone", "--depth", "1"]
              if branch:
                  cmd.extend(["--branch", branch])
              cmd.extend([url, str(dest)])
              subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def _collect_files(self, base: Path, patterns: List[str]) -> List[Path]:
              matched: List[Path] = []
              for pattern in patterns:
                  found = list(base.glob(pattern))
                  matched.extend(found)
              return matched
      PYEOF

      cat << 'PYEOF' > /tmp/app/vector_db/pgvector_provider.py
      import logging
      from typing import List
      from urllib.parse import urlparse
      from langchain_core.documents import Document
      from langchain_huggingface import HuggingFaceEmbeddings
      from langchain_postgres import PGEngine, PGVectorStore
      from vector_db.db_provider import DBProvider

      logger = logging.getLogger(__name__)

      class PGVectorProvider(DBProvider):
          def __init__(
              self,
              embeddings: HuggingFaceEmbeddings,
              url: str,
              collection_name: str,
          ):
              super().__init__(embeddings)
              engine = PGEngine.from_connection_string(url)
              engine.init_vectorstore_table(collection_name, self.embedding_length)
              self.db = PGVectorStore.create_sync(engine, self.embeddings, collection_name)
              parsed = urlparse(url)
              postgres_location = (
                  f"{parsed.hostname}:{parsed.port or 5432}/{parsed.path.lstrip('/')}"
              )
              logger.info(
                  "Connected to PGVector at %s (collection: %s)",
                  postgres_location,
                  collection_name,
              )

          def add_documents(self, docs: List[Document]) -> None:
              for doc in docs:
                  doc.page_content = doc.page_content.replace("\x00", "")
              batch_size = 32
              total = len(docs)
              for i in range(0, total, batch_size):
                  batch = docs[i : i + batch_size]
                  logger.info("Embedding and indexing batch %d-%d of %d chunks...", i + 1, min(i + batch_size, total), total)
                  self.db.add_documents(batch)
      PYEOF

      echo "[Init] Starting embedding pipeline from /tmp/app..."
      cd /tmp/app
      python3 ./embed_documents.py

  # Environment overrides
  tempDir: /docs
  logLevel: info
  repoSources:
    - repo: https://github.com/openshift/openshift-docs.git
      branch: enterprise-4.22
      globs:
        - cli_reference/**/*.adoc
        - applications/**/*.adoc
        - networking/**/*.adoc
        - operators/**/*.adoc
        - storage/**/*.adoc
        - authentication/**/*.adoc
        - security/**/*.adoc
  webSources: []
  chunking:
    size: 2048
    overlap: 200
  embeddingModel: Qwen/Qwen3-Embedding-0.6B

  resources:
    limits:
      cpu: '2'
      memory: 3Gi
    requests:
      cpu: 500m
      memory: 1Gi

  securityContext:
    runAsUser:
    runAsGroup:
    fsGroup:

  volumeMounts:
    - mountPath: /cache/
      name: cache-volume
    - mountPath: /docs/
      name: doc-volume

  volumes:
    - name: cache-volume
      emptyDir:
        sizeLimit: 5Gi
    - name: doc-volume
      emptyDir:
        sizeLimit: 5Gi

secretStore:
  name: vault-backend
  kind: ClusterSecretStore

hfmodel:
  key: secret/data/hub/hfmodel

edb:
  key: secret/data/hub/edb

# Create NetworkPolicy to allow traffic from all namespaces to allow monitoring. Set to false if monitoring is not needed
customnetworkpolicy:
  enabled: true
