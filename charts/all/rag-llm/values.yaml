global:
  localClusterDomain: apps.example.com
  hubClusterDomain: example.com
  db:
    index: docs
    type: PGVECTOR
  model:
    vllm: google/gemma-4-E4B-it
    embedding: Qwen/Qwen3-Embedding-0.6B
    storageClass: gp3-csi

llmui:
  namespace: "rag-llm"


replicaCount: 1

image:
  repository: quay.io/dminnear/gradio-tgi-multi-model-rag
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

ui:
  build:
    enabled: true
  imageStream:
    name: rag-llm-ui
    tag: latest
  buildConfig:
    name: rag-llm-ui

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000


securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 7860
  metricsPort: 8000

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: '2'
    memory: 2Gi
  requests:
    cpu: '1'
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  timeoutSeconds: 8
  periodSeconds: 100
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  timeoutSeconds: 5
  periodSeconds: 30
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  timeoutSeconds: 1
  periodSeconds: 30
  successThreshold: 1
  failureThreshold: 24

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: providerconfig
    configMap:
      name: providerconfig
      defaultMode: 420
  - name: cache-volume
    emptyDir:
      sizeLimit: 5Gi
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: providerconfig
    mountPath: /opt/app-root/config
  - name: cache-volume
    mountPath: /tmp/.cache
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 1

route:
  enabled: true
  name: llm-ui
  portName: http
  labels:
  annotations:
  # path: /

populateDbJob:
  enabled: false
  # A run ID creates a persistent Job. Change it in Git to start another run.
  runId: ""
  ## Job image
  image:
    repository: quay.io/hybridcloudpatterns/vector-embedder
    tag: latest
    pullPolicy: Always

  ## Job configurations
  backoffLimit: 10
  restartPolicy: Never

  command:
    - python3
    - /portal-loader/populate.py

  # When enabled, reserve one GPU for the whole population job.
  gpu:
    enabled: false
  embeddingBatchSize: 32

  # Environment overrides
  tempDir: /docs
  logLevel: info
  corpusPath: docs/openshift_4_22_portal_snapshot
  chunking:
    size: 2048
    overlap: 200

  resources:
    limits:
      cpu: '8'
      memory: 16Gi
    requests:
      cpu: '4'
      memory: 4Gi

  securityContext:
    runAsUser:
    runAsGroup:
    fsGroup:

  volumeMounts:
    - mountPath: /cache/
      name: cache-volume
    - mountPath: /docs/
      name: doc-volume

  volumes:
    - name: cache-volume
      emptyDir:
        sizeLimit: 5Gi
    - name: doc-volume
      emptyDir:
        sizeLimit: 5Gi

secretStore:
  name: vault-backend
  kind: ClusterSecretStore

hfmodel:
  key: secret/data/hub/hfmodel

edb:
  key: secret/data/hub/edb

# Create NetworkPolicy to allow traffic from all namespaces to allow monitoring. Set to false if monitoring is not needed
customnetworkpolicy:
  enabled: true
