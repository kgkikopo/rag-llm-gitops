{{- if and .Values.populateDbJob .Values.populateDbJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name:  populate-vectordb-{{ include "rag-llm.fullname" . }}
  labels:
    {{- include "rag-llm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        {{- include "rag-llm.labels" . | nindent 8 }}
    spec:
    {{- if .Values.populateDbJob.imagePullSecrets }}
      imagePullSecrets:
      - name: {{ .Values.populateDbJob.imagePullSecrets }}
    {{- end }}
    {{- if .Values.populateDbJob.securityContext.runAsUser }}
      securityContext:
        runAsUser: {{ .Values.populateDbJob.securityContext.runAsUser }}
        {{- if .Values.populateDbJob.securityContext.runAsGroup }}
        runAsGroup: {{ .Values.populateDbJob.securityContext.runAsGroup }}
        {{- end }}
        {{- if .Values.populateDbJob.securityContext.fsGroup }}
        fsGroup: {{ .Values.populateDbJob.securityContext.fsGroup }}
        {{- end }}
    {{- end }}
      initContainers:
      - name: clear-vectordb
        image: "{{ .Values.populateDbJob.image.repository }}:{{ .Values.populateDbJob.image.tag }}"
        imagePullPolicy: {{ .Values.populateDbJob.image.pullPolicy }}
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: dbname
        - name: PGVECTOR_COLLECTION_NAME
          value: {{ .Values.global.db.index }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            python3 - << 'PY'
            import os, sys, time, psycopg

            user = os.environ.get("DB_USERNAME", "postgres")
            password = os.environ.get("DB_PASS", "postgres")
            host = os.environ.get("DB_HOST", "pgvector")
            port = os.environ.get("DB_PORT", "5432")
            dbname = os.environ.get("DB_NAME", "rag_blueprint")
            collection = os.environ.get("PGVECTOR_COLLECTION_NAME", "docs")

            print(f"[Init] Connecting to {dbname} at {host}:{port} as {user}...")
            for attempt in range(1, 11):
                try:
                    with psycopg.connect(
                        host=host, port=port, dbname=dbname, user=user, password=password, autocommit=True, connect_timeout=5
                    ) as conn:
                        with conn.cursor() as cur:
                            print(f"[Init] Dropping table if exists: {collection}")
                            cur.execute(f'DROP TABLE IF EXISTS "{collection}" CASCADE;')
                            cur.execute("DROP TABLE IF EXISTS langchain_pg_embedding CASCADE;")
                            cur.execute("DROP TABLE IF EXISTS langchain_pg_collection CASCADE;")
                            cur.execute("CREATE EXTENSION IF NOT EXISTS vector;")
                            print("[Init] Vector database table cleared successfully.")
                            sys.exit(0)
                except Exception as e:
                    print(f"[Init] Attempt {attempt}/10: {e}")
                    time.sleep(2)
            sys.exit(1)
            PY
      containers:
      - image: "{{ .Values.populateDbJob.image.repository }}:{{ .Values.populateDbJob.image.tag }}"
        imagePullPolicy: {{ .Values.populateDbJob.image.pullPolicy }}
        name: populate-vectordb
        env:
        - name: TEMP_DIR
          value: {{ .Values.populateDbJob.tempDir }}
        - name: LOG_LEVEL
          value: {{ .Values.populateDbJob.logLevel }}
        - name: REPO_SOURCES
          value: {{ .Values.populateDbJob.repoSources | toJson | quote }}
        - name: WEB_SOURCES
          value: {{ .Values.populateDbJob.webSources | toJson | quote }}
        - name: CHUNK_SIZE
          value: {{ .Values.populateDbJob.chunking.size | quote }}
        - name: CHUNK_OVERLAP
          value: {{ .Values.populateDbJob.chunking.overlap | quote }}
        - name: EMBEDDING_MODEL
          value: {{ .Values.global.model.embedding }}
        - name: DB_TYPE
          value: "PGVECTOR"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: username
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: port
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: dbname
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: host
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: password
        - name: PGVECTOR_URL
          value: 'postgresql+psycopg://$(DB_USERNAME):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)'
        - name: PGVECTOR_COLLECTION_NAME
          value: {{ .Values.global.db.index }}
        {{- if .Values.populateDbJob.command }}
        command:
          {{- toYaml .Values.populateDbJob.command | nindent 10 }}
        {{- end }}
        {{- if .Values.populateDbJob.args }}
        args:
          {{- toYaml .Values.populateDbJob.args | nindent 10 }}
        {{- end }}
        {{- with .Values.populateDbJob.resources }}
        resources:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.populateDbJob.volumeMounts }}
        volumeMounts:
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- with .Values.populateDbJob.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.populateDbJob.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.populateDbJob.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.populateDbJob.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      restartPolicy: {{ .Values.populateDbJob.restartPolicy }}
  backoffLimit: {{ .Values.populateDbJob.backoffLimit }}
{{- end }}
