{{- if and .Values.populateDbJob .Values.populateDbJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name:  populate-vectordb-{{ include "rag-llm.fullname" . }}
  labels:
    {{- include "rag-llm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        {{- include "rag-llm.labels" . | nindent 8 }}
    spec:
    {{- if .Values.populateDbJob.imagePullSecrets }}
      imagePullSecrets:
      - name: {{ .Values.populateDbJob.imagePullSecrets }}
    {{- end }}
    {{- if .Values.populateDbJob.securityContext.runAsUser }}
      securityContext:
        runAsUser: {{ .Values.populateDbJob.securityContext.runAsUser }}
        {{- if .Values.populateDbJob.securityContext.runAsGroup }}
        runAsGroup: {{ .Values.populateDbJob.securityContext.runAsGroup }}
        {{- end }}
        {{- if .Values.populateDbJob.securityContext.fsGroup }}
        fsGroup: {{ .Values.populateDbJob.securityContext.fsGroup }}
        {{- end }}
    {{- end }}
      containers:
      - image: "{{ .Values.populateDbJob.image.repository }}:{{ .Values.populateDbJob.image.tag }}"
        imagePullPolicy: {{ .Values.populateDbJob.image.pullPolicy }}
        name: populate-vectordb
        env:
        - name: TMPDIR
          value: {{ .Values.populateDbJob.tempDir }}
        - name: LOG_LEVEL
          value: {{ .Values.populateDbJob.logLevel }}
        - name: REPO_SOURCES
          value: {{ list (dict "repo" (.Values.global.repoURL | default "https://github.com/kgkikopo/rag-llm-gitops.git") "branch" (.Values.global.targetRevision | default "main") "path" .Values.populateDbJob.corpusPath) | toJson | quote }}
        - name: CHUNK_SIZE
          value: {{ .Values.populateDbJob.chunking.size | quote }}
        - name: CHUNK_OVERLAP
          value: {{ .Values.populateDbJob.chunking.overlap | quote }}
        - name: EMBEDDING_MODEL
          value: {{ .Values.global.model.embedding }}
        - name: EMBEDDING_DEVICE
          value: {{ ternary "cuda" "cpu" .Values.populateDbJob.gpu.enabled | quote }}
        - name: EMBEDDING_BATCH_SIZE
          value: {{ .Values.populateDbJob.embeddingBatchSize | quote }}
        - name: HF_HOME
          value: /cache/huggingface
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: username
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: dbname
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: host
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: vectordb-app
              key: password
        - name: PGVECTOR_COLLECTION_NAME
          value: {{ .Values.global.db.index }}
        {{- if .Values.populateDbJob.command }}
        command:
          {{- toYaml .Values.populateDbJob.command | nindent 10 }}
        {{- end }}
        {{- if .Values.populateDbJob.args }}
        args:
          {{- toYaml .Values.populateDbJob.args | nindent 10 }}
        {{- end }}
        {{- $resources := deepCopy (.Values.populateDbJob.resources | default dict) }}
        {{- if .Values.populateDbJob.gpu.enabled }}
        {{- $limits := get $resources "limits" | default dict }}
        {{- $_ := set $limits "nvidia.com/gpu" 1 }}
        {{- $_ := set $resources "limits" $limits }}
        {{- end }}
        {{- with $resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: portal-loader
          mountPath: /portal-loader
          readOnly: true
        {{- with .Values.populateDbJob.volumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: portal-loader
        configMap:
          name: {{ include "rag-llm.fullname" . }}-portal-loader
      {{- with .Values.populateDbJob.volumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.populateDbJob.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.populateDbJob.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if or .Values.populateDbJob.gpu.enabled .Values.populateDbJob.tolerations }}
      tolerations:
        {{- if .Values.populateDbJob.gpu.enabled }}
        - key: odh-notebook
          operator: Exists
          effect: NoSchedule
        {{- end }}
        {{- with .Values.populateDbJob.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      restartPolicy: {{ .Values.populateDbJob.restartPolicy }}
  backoffLimit: {{ .Values.populateDbJob.backoffLimit }}
{{- end }}
